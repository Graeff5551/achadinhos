<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Achadinhos</title><link rel="stylesheet" href="index.css"></head><body><header><nav><h1>🔥 Achadinhos</h1><button onclick="mostrarLogin()">🔐 Login</button></nav></header><div id="loginContainer" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;display:flex;align-items:center;justify-content:center"><div style="background:white;padding:30px;border-radius:10px"><h2>Login</h2><input id="emailInput" type="email" placeholder="pauloverifica@gmail.com" style="width:100%;padding:10px;margin:10px 0"><input id="senhaInput" type="password" placeholder="senha" style="width:100%;padding:10px;margin:10px 0"><button onclick="login()" style="background:#ff6b6b;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer">Entrar</button></div></div><main><div id="produtosContainer" style="max-width:1200px;margin:50px auto;padding:20px"><h2>🛒 Ofertas</h2><p>Faça login para ver produtos!</p></div><div id="adminPanel" style="display:none;background:#333;color:white;padding:20px;margin:20px 0"><h3>⚙️ Admin</h3><input id="produtoNome" placeholder="Nome"><input id="produtoPreco" placeholder="29.90"><input id="produtoImagem" placeholder="https://i.imgur.com/xxx.jpg"><button onclick="adicionarProduto()">Adicionar</button></div></main><script>const emailsAdmin=["pauloverifica@gmail.com","palomatjk@gmail.com"];function verificarAdmin(e){return emailsAdmin.some(a=>e?.trim().toLowerCase()===a.toLowerCase())};let emailLogado=null;function mostrarLogin(){document.getElementById('loginContainer').style.display='flex'};function login(){const e=document.getElementById('emailInput').value,t=document.getElementById('senhaInput').value;if(e&&t){emailLogado=e;if(verificarAdmin(emailLogado)){document.getElementById('adminPanel').style.display='block';alert('✅ Admin!')}else{alert('Login ok!')}document.getElementById('loginContainer').style.display='none';document.getElementById('emailInput').value='';document.getElementById('senhaInput').value='' }else alert('Email/senha!')};function adicionarProduto(){const e=document.getElementById('produtoNome').value,t=document.getElementById('produtoPreco').value,a=document.getElementById('produtoImagem').value;if(e&&t&&a){const n={id:Date.now(),nome:e,preco:t,imagem:a};let o=JSON.parse(localStorage.getItem('produtos'))||[];o.unshift(n),localStorage.setItem('produtos',JSON.stringify(o)),carregarProdutos(),alert('✅ Adicionado!')}else alert('Preencha tudo!')};function carregarProdutos(){const e=JSON.parse(localStorage.getItem('produtos'))||[],t=document.getElementById('produtosContainer');if(e.length){let a="";e.forEach(e=>{a+=`<div style="border:1px solid #ddd;padding:20px;margin:10px;border-radius:10px"><img src="${e.imagem}" style="width:100px;height:100px;object-fit:cover" onerror="this.src='https://via.placeholder.com/100'"><h3>${e.nome}</h3><p>R$ ${e.preco}</p>${verificarAdmin(emailLogado)?`<button onclick="removerProduto(${e.id})">🗑️</button>`:""}</div>`}),t.innerHTML=`<h2>Ofertas (${e.length})</h2>${a}`}else t.innerHTML='<h2>Ofertas</h2><p>Login como admin para adicionar!</p>'};function removerProduto(e){if(confirm('Remover?')){let t=JSON.parse(localStorage.getItem('produtos'))||[];t=t.filter(t=>t.id!=e),localStorage.setItem('produtos',JSON.stringify(t)),carregarProdutos()}};carregarProdutos();</script></body></html>
